name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Jessidy
          outputs: |
            dist/github-snake.svg?color_snake=2563eb&color_dots=f1f5f9,dbeafe,93c5fd,3b82f6,1d4ed8
            dist/github-snake-dark.svg?color_snake=60a5fa&color_dots=0f172a,172554,1e3a8a,2563eb,60a5fa

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
